[project]
name = "p42cloud-ipam"
version = "0.1.1"
description = "IPAM: VLANs, subnets, addresses and DNS records"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["p42cloud", "dnspython", "httpx"]

[project.entry-points."p42cloud.modules"]
ipam = "p42cloud_ipam:module"

[tool.uv.sources]
p42cloud = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p42cloud_ipam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
