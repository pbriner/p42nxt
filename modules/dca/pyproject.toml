[project]
name = "p42cloud-dca"
version = "0.9.1"
description = "Kraken DCA: dollar cost averaging on your own Kraken account"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["p42cloud"]

[project.entry-points."p42cloud.modules"]
dca = "p42cloud_dca:module"

[tool.uv.sources]
p42cloud = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p42cloud_dca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
