<button
  mat-icon-button
  type="button"
  class="bell"
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="label()"
  [matTooltip]="i18n.t('bell.label')"
  (menuOpened)="load()"
>
  <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
  @if (unread()) {
    <span class="badge" aria-hidden="true">{{ badge() }}</span>
  }
</button>
<mat-menu #menu="matMenu" xPosition="before" class="bell-menu">
  <div class="head" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <h2>{{ i18n.t('bell.title') }}</h2>
    @if (notes().length) {
      <button mat-button type="button" (click)="markAll()">{{ i18n.t('bell.mark_all') }}</button>
    }
  </div>
  @if (failed()) {
    <p class="failed" role="status">{{ i18n.t('bell.failed') }}</p>
  } @else if (!notes().length) {
    <div class="empty" role="status">
      <span class="material-symbols-outlined" aria-hidden="true">done_all</span>
      <strong>{{ i18n.t('bell.empty_title') }}</strong>
      <span>{{ i18n.t('bell.empty') }}</span>
    </div>
  } @else {
    @for (note of notes(); track note.sys_id) {
      <button mat-menu-item type="button" class="note" (click)="open(note)">
        <span class="material-symbols-outlined severity" aria-hidden="true" [attr.data-severity]="note.severity">{{
          icons[note.severity] ?? 'info'
        }}</span>
        <span class="text">
          <span class="title">{{ note.title }}</span>
          @if (note.message) {
            <span class="message">{{ note.message }}</span>
          }
          <span class="when">{{ when(note.created) }}</span>
        </span>
      </button>
    }
  }
  <a mat-menu-item class="all" routerLink="/list/sys.notification">{{ i18n.t('bell.show_all') }}</a>
</mat-menu>
