[project]
name = "p42cloud"
version = "0.28.0"
description = "P42cloud platform: a business platform for small companies"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["../LICENSE", "../NOTICE"]
dependencies = [
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "webauthn>=3.0.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "packaging>=26.3",
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
p42cloud = "p42cloud.cli.main:main"
p42cloud-web = "p42cloud.web.main:main"
p42cloud-worker = "p42cloud.worker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p42cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PL", "C90"]

[tool.ruff.lint.per-file-ignores]
# Route handlers take their path, body, request, response and caller as parameters (FastAPI).
"src/p42cloud/web/routes/**" = ["PLR0913", "PLR0917"]
# Tests build SQL from the names of tables they declared themselves.
# ... and use made-up passwords.
"tests/**" = ["S101", "PLR2004", "S608", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

# Layers (docs/architecture.md): a layer imports only the layers below it.
[tool.importlinter]
root_package = "p42cloud"

[[tool.importlinter.contracts]]
name = "Platform layers"
type = "layers"
layers = [
    "p42cloud.web | p42cloud.cli | p42cloud.worker",
    "p42cloud.sdk",
    "p42cloud.modules",
    "p42cloud.ui",
    "p42cloud.services",
    "p42cloud.security",
    "p42cloud.data",
    "p42cloud.kernel",
]
