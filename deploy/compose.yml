# One P42cloud installation: its database, and the p42cloud app image as web and worker.
# Created by install.sh, which writes the .env next to this file. The database isn't reachable
# from outside the installation.
name: ${COMPOSE_PROJECT_NAME}

x-p42: &p42
  image: ${P42_IMAGE}
  environment:
    P42_ENVIRONMENT: ${P42_ENVIRONMENT}
    P42_DATABASE_URL: postgresql+asyncpg://p42_app:${P42_APP_PASSWORD}@postgres/p42
    P42_OWNER_DATABASE_URL: postgresql+asyncpg://p42_owner:${P42_OWNER_PASSWORD}@postgres/p42
    P42_MASTER_KEY_FILE: /run/secrets/master_key
  secrets: [master_key]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: p42_admin
      POSTGRES_PASSWORD: ${P42_ADMIN_PASSWORD}
      POSTGRES_DB: p42
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p42_admin -d p42"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The app: the HTTP API. Only on this machine: a reverse proxy in front of it does TLS.
  web:
    <<: *p42
    entrypoint: ["p42cloud-web"]
    environment:
      P42_ENVIRONMENT: ${P42_ENVIRONMENT}
      P42_DATABASE_URL: postgresql+asyncpg://p42_app:${P42_APP_PASSWORD}@postgres/p42
      P42_OWNER_DATABASE_URL: postgresql+asyncpg://p42_owner:${P42_OWNER_PASSWORD}@postgres/p42
      P42_MASTER_KEY_FILE: /run/secrets/master_key
      # The web installer's one-time code: it works only until the first administrator exists.
      P42_SETUP_CODE: ${P42_SETUP_CODE}
    ports:
      - "127.0.0.1:${P42_PORT}:8000"
    restart: unless-stopped

  # The worker: runs jobs and schedules. Reachable from nowhere; it only talks to the database,
  # and writes the daily backups into the installation's backup folder.
  worker:
    <<: *p42
    entrypoint: ["p42cloud-worker"]
    environment:
      P42_ENVIRONMENT: ${P42_ENVIRONMENT}
      P42_DATABASE_URL: postgresql+asyncpg://p42_app:${P42_APP_PASSWORD}@postgres/p42
      P42_OWNER_DATABASE_URL: postgresql+asyncpg://p42_owner:${P42_OWNER_PASSWORD}@postgres/p42
      P42_MASTER_KEY_FILE: /run/secrets/master_key
      P42_BACKUP_DIR: /backups
    volumes:
      - ${P42_BACKUPS}:/backups
    restart: unless-stopped

  # One-off commands, run by install.sh.
  setup:
    <<: *p42
    command: ["setup-database"]
    environment:
      P42_ENVIRONMENT: ${P42_ENVIRONMENT}
      P42_ADMIN_DATABASE_URL: postgresql+asyncpg://p42_admin:${P42_ADMIN_PASSWORD}@postgres/p42
      P42_DATABASE_URL: postgresql+asyncpg://p42_app:${P42_APP_PASSWORD}@postgres/p42
      P42_OWNER_DATABASE_URL: postgresql+asyncpg://p42_owner:${P42_OWNER_PASSWORD}@postgres/p42
    profiles: [tools]
  upgrade:
    <<: *p42
    command: ["upgrade"]
    profiles: [tools]
  check:
    <<: *p42
    command: ["check"]
    profiles: [tools]
  audit-verify:
    <<: *p42
    command: ["audit", "verify"]
    profiles: [tools]
  # Asks for the password and the authenticator code: run it with `docker compose run --rm`.
  create-admin:
    <<: *p42
    entrypoint: ["p42cloud", "create-admin"]
    stdin_open: true
    tty: true
    profiles: [tools]

secrets:
  master_key:
    file: ./master.key

volumes:
  pgdata:
