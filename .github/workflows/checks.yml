# The checks every pull request must pass (AGENTS.md "Done means").
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"  # weekly, for vulnerabilities published since the last change

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Database
        working-directory: .
        run: docker compose up -d --wait postgres
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # One workspace: the platform and every module, from the lock file at the root.
      - run: uv sync --locked --all-packages
      - name: Known vulnerabilities in dependencies
        run: |
          uv export --locked --no-dev --no-emit-workspace --all-packages -q \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Layers
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q
      # Every module is checked in its own folder: lint, types and its own tests, against a
      # fresh installation of the core and the module (modules import only the SDK: the
      # platform's tests check that).
      - name: Modules
        working-directory: modules
        run: |
          for module in */; do
            [ -f "$module/pyproject.toml" ] || continue
            echo "::group::${module%/}"
            (cd "$module" && uv run ruff check . && uv run ruff format --check . \
              && uv run pyright && uv run pytest -q) || exit 1
            echo "::endgroup::"
          done

  # The browser app: format, build, and the browser tests at four sizes against a real
  # installation (the core and the modules) serving the built app.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Database
        working-directory: .
        run: docker compose up -d --wait postgres
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
        working-directory: .
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  # Changing a package means releasing it (AGENTS.md): a new version and a CHANGELOG.md entry
  # for every package whose shipped files changed in this pull request.
  releases:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: Versions and changelogs
        run: uv run python -m p42cloud.modules.release_tool check --base "origin/${{ github.base_ref }}"

  # Setup must keep working after every change (docs/architecture.md, principle 5): the real
  # installer creates a fresh installation from the image built here.
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Where installations go
        run: |
          echo "P42_HOME=$RUNNER_TEMP/p42" >> "$GITHUB_ENV"
          echo "P42_BACKUPS=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
      - name: Image
        run: docker build -t p42cloud:ci .
      - name: Install
        run: deploy/install.sh ci --image p42cloud:ci
      - name: The audit log of the new installation verifies
        run: docker compose --project-directory "$P42_HOME/ci" run --rm audit-verify
      - name: A second install under the same name is refused
        run: |
          if deploy/install.sh ci --image p42cloud:ci; then
            echo "the installer took over an existing installation" >&2; exit 1
          fi
      - name: Logs (when it fails)
        if: failure()
        run: docker compose --project-directory "$P42_HOME/ci" logs --tail 200 postgres web worker
