# The checks every pull request must pass (AGENTS.md "Done means").
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"  # weekly, for vulnerabilities published since the last change

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Database
        working-directory: .
        run: docker compose up -d --wait postgres
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # One workspace: the platform and every module, from the lock file at the root.
      - run: uv sync --locked --all-packages
      - name: Known vulnerabilities in dependencies
        run: |
          uv export --locked --no-dev --no-emit-workspace --all-packages -q \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Layers
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q
      # Every module is checked in its own folder: lint, types and its own tests, against a
      # fresh installation of the core and the module (modules import only the SDK: the
      # platform's tests check that).
      - name: Modules
        working-directory: modules
        run: |
          for module in */; do
            [ -f "$module/pyproject.toml" ] || continue
            echo "::group::${module%/}"
            (cd "$module" && uv run ruff check . && uv run ruff format --check . \
              && uv run pyright && uv run pytest -q) || exit 1
            echo "::endgroup::"
          done

  # Setup must keep working after every change (docs/architecture.md, principle 5): the real
  # installer creates a fresh installation from the image built here.
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Where installations go
        run: |
          echo "P42_HOME=$RUNNER_TEMP/p42" >> "$GITHUB_ENV"
          echo "P42_BACKUPS=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
      - name: Image
        run: docker build -t p42cloud:ci .
      - name: Install
        run: deploy/install.sh ci --image p42cloud:ci
      - name: The audit log of the new installation verifies
        run: docker compose --project-directory "$P42_HOME/ci" run --rm audit-verify
      - name: A second install under the same name is refused
        run: |
          if deploy/install.sh ci --image p42cloud:ci; then
            echo "the installer took over an existing installation" >&2; exit 1
          fi
      - name: Database log (when it fails)
        if: failure()
        run: docker compose --project-directory "$P42_HOME/ci" logs --tail 200 postgres
